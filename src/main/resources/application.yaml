server:
  port: 8080

wechat:
  app-id: ${WX_APP_ID:${WECHAT_APP_ID:}}
  app-secret: ${WX_APP_SECRET:${WECHAT_APP_SECRET:}}
  api-url: ${WECHAT_API_URL:https://api.weixin.qq.com/sns/jscode2session}

spring:
  application:
    name: campus-market-server
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Prefer the explicit DB_* variables, but support CloudBase's managed
    # MySQL binding without requiring a manually assembled JDBC URL.
    url: "${DB_URL:jdbc:mysql://${MYSQL_ADDRESS:localhost:3306}/${MYSQL_DATABASE:campus_market}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}"
    username: "${DB_USERNAME:${MYSQL_USERNAME}}"
    password: "${DB_PASSWORD:${MYSQL_PASSWORD}}"

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.example.campusmarketserver.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    root: info
    com.example.campusmarketserver: debug
    com.example.campusmarketserver.mapper: debug
